<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #222;
      background: #f7f7f4;
      line-height: 1.7;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 72px 24px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(2rem, 6vw, 3.5rem);
      line-height: 1.15;
    }

    p {
      margin: 0 0 16px;
      font-size: 1.05rem;
    }

    a {
      color: #126b63;
    }

    footer {
      margin-top: 48px;
      font-size: 0.9rem;
      color: #666;
    }
  </style>
</head>
<body>
  <main>
    <h1>My Website</h1>
    <p>こんにちは。ここはGitHub Pagesで公開している自分のWebサイトです。</p>
    <p>これからプロフィール、作品、メモなどを少しずつ追加していきます。</p>

    <footer>
      <p>&copy; 2026 My Website</p>
    </footer>
  </main>
</body>
</html>
